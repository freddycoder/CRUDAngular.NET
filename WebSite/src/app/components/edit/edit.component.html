@if (entity) {
  <div>
    <h2>{{ entity.name }}</h2>
    @for (prop of this.fields; track $index) {
      <div>
        <mat-form-field appearance="fill">
          <mat-label>{{ prop }}</mat-label>
          <input [(ngModel)]="entity[prop]" placeholder="{{ prop }}" matInput />
        </mat-form-field>
      </div>
    }
    @if (entity.id) {
      <button mat-stroked-button color="primary" (click)="update(entity)">Save</button>
    }
    @if (entity.id) {
      <button mat-stroked-button color="secondary" (click)="deleteEntity(entity)">Delete</button>
    }
    @if (!entity.id) {
      <button mat-stroked-button color="primary" (click)="create(entity)">Create</button>
    }
  </div>
}
